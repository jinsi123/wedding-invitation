<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>병준 ♥ 시연 결혼합니다</title>
  <!-- 카카오톡/문자 공유 미리보기. 배포 후 og:image는 절대 URL(https://...)로 바꿔야 미리보기 사진이 뜹니다. -->
  <meta property="og:title" content="병준 ♥ 시연 결혼합니다">
  <meta property="og:description" content="2027년 10월 30일 토요일 오전 11시, 구리 아르비아웨딩홀">
  <meta property="og:image" content="https://jinsi123.github.io/wedding-invitation/images/main.jpg">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Archivo:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* 밝고 산뜻한 화이트 무드: 사진 위 흰 손글씨 + 흰 별·꽃 낙서, 본문은 흰 바탕에 부드러운 회색 글씨.
       포인트 색(세이지 그린)은 달력 동그라미, 숫자, 라벨 같은 작은 강조에만 씀 */
    :root {
      --black: #2b2b2b;
      --white: #ffffff;
      --ink: #3d3d3d;
      --muted: #8a8a8a;
      --line: #ececec;
      --soft: #f7f7f5;
      --page: #f1f1ee;         /* 휴대폰보다 넓은 화면의 바깥 여백 */
      --green: #5c7756;        /* 세이지 그린: 흰 바탕 위 작은 글씨도 읽히는 진하기 */
      --green-light: #eef2ec;
      --font-hand: "Sacramento", cursive;
      --font-en: "Archivo", "Helvetica Neue", sans-serif;
      --font-serif: "Nanum Myeongjo", serif;
      --font-body: "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 430px; margin: 0 auto; background: var(--white); min-height: 100vh; overflow: hidden; }
    section { padding: 64px 28px; text-align: center; }
    h2 { margin-bottom: 28px; font-weight: 400; display: grid; gap: 4px; }
    h2 .script { font-family: var(--font-en); font-size: 13px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; line-height: 1.3; color: var(--green); }
    h2 small { font-family: var(--font-body); font-size: 17px; font-weight: 400; color: var(--ink); letter-spacing: .02em; }
    .muted { color: var(--muted); font-size: 14px; }

    /* ---------- 표지: 사진 전체 + 흰 손글씨 + 흰 낙서 + 하단 이름 ---------- */
    .poster { position: relative; aspect-ratio: 9 / 16; padding: 0; color: var(--white); overflow: hidden; }
    .poster-photo {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      /* 사진이 없을 때(공개 사이트) 하늘·풀밭 느낌의 대체 배경 */
      background: linear-gradient(180deg, #b9c9d6 0%, #cfd9df 26%, #a6b48e 50%, #73855c 75%, #4c5a3b 100%);
    }
    /* 위쪽 손글씨와 아래쪽 이름이 잘 읽히게 사진 위·아래만 살짝 어둡게 */
    .shade {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.22) 0%, transparent 30%, transparent 62%, rgba(0,0,0,.42) 100%);
    }
    .poster-title {
      /* 세 줄이 머리 위(세로 약 20%)에서 끝나도록 크기를 맞춤 */
      position: absolute; left: 0; right: 0; top: 3%;
      font-family: var(--font-hand); font-weight: 400; font-size: clamp(42px, 12.5vw, 52px); line-height: .86;
      text-shadow: 0 1px 10px rgba(0, 0, 0, .18);
    }
    .poster-title span { display: block; white-space: nowrap; }
    /* 레퍼런스처럼 세 줄을 좌우로 엇갈려 배치 */
    .poster-title .l1 { padding-left: 30%; }
    .poster-title .l2 { padding-left: 9%; }
    .poster-title .l3 { padding-left: 46%; }
    .sparkles { position: absolute; inset: 0; pointer-events: none; color: var(--white); }
    .sparkles svg { position: absolute; filter: drop-shadow(0 0 3px rgba(255,255,255,.6)); }
    .poster-names {
      position: absolute; left: 0; right: 0; bottom: 6.5%;
      display: grid; gap: 2px; text-shadow: 0 1px 8px rgba(0, 0, 0, .25);
    }
    .poster-names b { font-weight: 400; font-size: 18px; letter-spacing: .18em; }
    .poster-names p { font-size: 12px; letter-spacing: .04em; opacity: .92; }
    .poster-names p:first-of-type { margin-top: 12px; }

    /* ---------- 본문 ---------- */
    .names { font-family: var(--font-serif); font-size: 20px; letter-spacing: .1em; }
    .names span { font-family: var(--font-en); color: var(--green); font-size: 16px; margin: 0 10px; letter-spacing: 0; }
    .when { margin: 4px 0 40px; color: var(--muted); font-size: 13px; }
    .greeting p { white-space: pre-line; font-size: 14px; }
    .parents { margin-top: 36px; font-size: 14px; display: grid; gap: 2px; }
    .parents b { font-family: var(--font-serif); font-weight: 700; }

    /* table-layout: fixed 없으면 예식일 동그라미가 있는 열만 넓어짐 */
    .calendar { width: 100%; max-width: 300px; margin: 24px auto 0; border-collapse: collapse; font-size: 14px; table-layout: fixed; font-family: var(--font-en); }
    .calendar th { color: var(--muted); font-weight: 400; padding: 6px 0; font-family: var(--font-body); }
    .calendar td { padding: 3px 0; }
    .calendar td span { display: inline-block; width: 34px; height: 34px; line-height: 34px; }
    .calendar .sun { color: var(--green); }
    .calendar .day-on span { border-radius: 50%; background: var(--green); color: var(--white); font-weight: 500; }
    .dday { margin-top: 28px; font-size: 14px; }
    .dday b { color: var(--green); font-weight: 500; }

    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .gallery img, .gallery .ph {
      width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; display: block;
      filter: saturate(.85);
      background: linear-gradient(160deg, #eeeeee, #d6d6d6);
    }
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none;
      align-items: center; justify-content: center; z-index: 10; padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; }

    .venue-name { font-family: var(--font-serif); font-size: 19px; }
    .map-links { display: flex; gap: 8px; margin-top: 24px; }
    .btn {
      flex: 1; padding: 12px 8px; border: 1px solid #d9d9d9; border-radius: 10px;
      background: var(--white); color: var(--ink); font: inherit; font-size: 14px; font-weight: 400;
      text-decoration: none; cursor: pointer;
    }
    .btn:active { background: var(--soft); }
    .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .btn.primary { background: var(--green); border-color: var(--green); color: var(--white); }
    .map {
      width: 100%; height: 260px; margin-top: 24px; border: 1px solid var(--line);
      background: var(--green-light); display: grid; place-items: center; text-align: center;
    }
    .map-fallback { display: grid; gap: 6px; color: var(--ink); text-decoration: none; font-size: 14px; }
    .map-fallback b { font-family: var(--font-en); color: var(--green); font-size: 14px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; line-height: 1; }
    .map-fallback span { text-decoration: underline; text-underline-offset: 3px; }
    .transport { text-align: left; margin-top: 28px; font-size: 14px; }
    .transport dd { white-space: pre-line; }
    .transport dt { color: var(--green); font-weight: 500; margin-top: 14px; }

    .account-group { text-align: left; margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .account-group summary { padding: 14px 16px; cursor: pointer; list-style: none; font-size: 15px; font-weight: 400; }
    .account-group summary::after { content: "＋"; float: right; color: var(--muted); }
    .account-group[open] summary::after { content: "－"; }
    .account {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14px;
    }
    .account .btn { flex: none; padding: 6px 12px; font-size: 13px; }

    .share { display: flex; gap: 8px; }
    footer { padding: 48px 28px 40px; text-align: center; background: var(--soft); color: var(--muted); }
    footer .script { font-family: var(--font-hand); font-size: 40px; color: var(--ink); line-height: 1.2; }
    footer p:not(.script) { font-family: var(--font-en); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; margin-top: 10px; }

    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
      background: var(--black); color: var(--white); padding: 10px 18px; border-radius: 999px;
      font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .fade { opacity: 0; transform: translateY(16px); transition: opacity .8s, transform .8s; }
    .fade.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .fade { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- 표지 낙서: 반짝이는 별과 작은 꽃 -->
  <symbol id="star" viewBox="0 0 100 100">
    <path fill="currentColor" d="M50 0 C54 36 64 46 100 50 C64 54 54 64 50 100 C46 64 36 54 0 50 C36 46 46 36 50 0Z"/>
  </symbol>
  <symbol id="blossom" viewBox="0 0 100 100">
    <g fill="currentColor">
      <circle cx="50" cy="24" r="20"/>
      <circle cx="75" cy="42" r="20"/>
      <circle cx="65" cy="72" r="20"/>
      <circle cx="35" cy="72" r="20"/>
      <circle cx="25" cy="42" r="20"/>
    </g>
    <circle cx="50" cy="50" r="9" fill="#f2d98a"/>
  </symbol>
</svg>
<main>
  <section class="poster" aria-label="청첩장 표지">
    <img class="poster-photo" id="heroPhoto" alt="">
    <div class="shade"></div>
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>
    <p class="poster-title" id="posterTitle"></p>
    <div class="poster-names">
      <b id="posterGroom"></b>
      <b id="posterBride"></b>
      <p id="posterWhen"></p>
      <p id="posterVenue"></p>
    </div>
  </section>

  <section class="greeting fade">
    <p class="names" id="heroNames"></p>
    <p class="when" id="heroDate"></p>
    <h2><span class="script">Invitation</span><small>초대합니다</small></h2>
    <p id="greeting"></p>
    <div class="parents" id="parents"></div>
  </section>

  <section class="fade">
    <h2><span class="script">Wedding Day</span><small>예식 일시</small></h2>
    <p id="dateLine"></p>
    <table class="calendar" id="calendar"></table>
    <p class="dday" id="dday"></p>
  </section>

  <section class="fade" style="padding-left:0;padding-right:0">
    <h2><span class="script">Gallery</span><small>우리의 순간</small></h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="fade">
    <h2><span class="script">Location</span><small>찾아오시는 길</small></h2>
    <p class="venue-name" id="venueName"></p>
    <p class="muted" id="venueAddress"></p>
    <p class="muted" id="venuePhone"></p>
    <div class="map" id="naverMap"></div>
    <div class="map-links" id="mapLinks"></div>
    <dl class="transport" id="transport"></dl>
  </section>

  <section class="fade">
    <h2><span class="script">With Gratitude</span><small>마음 전하실 곳</small></h2>
    <p class="muted">참석이 어려우신 분들을 위해 기재했습니다.</p>
    <div id="accounts"></div>
  </section>

  <section class="fade">
    <h2><span class="script">Share</span><small>청첩장 공유</small></h2>
    <div class="share">
      <button class="btn" id="copyLink">링크 복사</button>
      <button class="btn primary" id="nativeShare">공유하기</button>
    </div>
  </section>

  <footer>
    <p class="script">Thank you</p>
    <p id="footNote"></p>
  </footer>
</main>

<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     여기만 수정하세요. (사진은 images/ 폴더에 넣고 파일명만 적기)
     ============================================================ */
  const CONFIG = {
    // order: "아들"/"딸" 대신 "장남", "차녀" 등으로 바꿔도 됩니다
    // en: 표지에 들어가는 영문 이름
    groom: { name: "김병준", short: "병준", en: "Byungjun", father: "김남흥", mother: "정미경", order: "아들" },
    bride: { name: "진시연", short: "시연", en: "Siyeon", father: "진호성", mother: "박순화", order: "딸" },
    date: "2027-10-30T11:00:00",   // 예식 일시 (24시간제)
    // 표지 손글씨 문구. 세 줄까지, 줄마다 좌우로 엇갈려 배치됩니다
    posterTitle: ["Together", "from this", "Day"],
    // address를 비워두면 "추후 안내"로 표시됩니다
    venue: {
      name: "아르비아웨딩홀",
      hall: "",                     // 예: "그랜드홀 9층" (정해지면 입력)
      address: "경기도 구리시 건원대로 44, 태영빌딩 8·9층",
      phone: "031-552-9000",
      mapQuery: "아르비아웨딩홀",   // 지도 앱 검색어
      lat: 37.60505,
      lng: 127.14045,
    },
    // 네이버 지도 API 키(Client ID). 비워두면 지도 대신 "네이버 지도에서 보기" 카드가 나옵니다
    naverMapClientId: "",
    greeting:
      "서로 다른 길을 걸어온 두 사람이\n이제 같은 길을 함께 걸어가려 합니다.\n\n" +
      "저희의 새로운 시작을\n축복해 주시면 감사하겠습니다.",
    heroPhoto: "images/main.jpg",
    gallery: ["images/childhood.jpg", "images/main.jpg"],  // 사진 추가: images/ 폴더에 넣고 여기에 파일명 추가
    transport: [
      { label: "지하철", text: "8호선·경의중앙선 구리역 하차\n8호선 7번 출구 또는 경의중앙선 1번 출구에서 도보 약 5분" },
      { label: "자가용", text: "내비게이션에 '아르비아웨딩홀' 또는 '구리시 건원대로 44' 입력" },
      { label: "주차", text: "주차 안내는 예식장 확인 후 업데이트 예정입니다" },
    ],
    accounts: {
      // 실제 계좌로 바꾸기 전까지 배포 금지
      groom: [
        { who: "신랑 김병준", bank: "은행명", number: "계좌번호 입력" },
        { who: "아버지 김남흥", bank: "은행명", number: "계좌번호 입력" },
        { who: "어머니 정미경", bank: "은행명", number: "계좌번호 입력" },
      ],
      bride: [
        { who: "신부 진시연", bank: "은행명", number: "계좌번호 입력" },
        { who: "아버지 진호성", bank: "은행명", number: "계좌번호 입력" },
        { who: "어머니 박순화", bank: "은행명", number: "계좌번호 입력" },
      ],
    },
  };
  /* ============================================================ */

  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, children = []) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };

  const wedding = new Date(CONFIG.date);
  const pad = (n) => String(n).padStart(2, "0");
  const dotDate = `${wedding.getFullYear()}.${pad(wedding.getMonth() + 1)}.${pad(wedding.getDate())}`;
  const enCouple = `${CONFIG.groom.en} & ${CONFIG.bride.en}`;
  const formatDate = (d) => {
    const h = d.getHours();
    const time = `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}시${d.getMinutes() ? ` ${d.getMinutes()}분` : ""}`;
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}요일 ${time}`;
  };

  function toast(message) {
    const t = $("toast");
    t.textContent = message;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1600);
  }

  // clipboard API는 https 또는 localhost에서만 동작해서 구형 방식으로 한 번 더 시도
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = el("textarea", { value: text });
      document.body.append(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("복사되었습니다");
  }

  function renderPoster() {
    const photo = $("heroPhoto");
    photo.src = CONFIG.heroPhoto;
    photo.onerror = () => photo.removeAttribute("src");

    CONFIG.posterTitle.forEach((words, i) => {
      $("posterTitle").append(el("span", { className: `l${i + 1}`, textContent: words }));
    });

    $("posterGroom").textContent = CONFIG.groom.name;
    $("posterBride").textContent = CONFIG.bride.name;
    $("posterWhen").textContent = formatDate(wedding);
    const { name, hall, address } = CONFIG.venue;
    $("posterVenue").textContent = address ? [name, hall].filter(Boolean).join(" ") : "";
    $("footNote").textContent = `${enCouple} · ${dotDate}`;
    renderSparkles();
  }

  // [모양, 가로%, 세로%, 크기px] - 얼굴(가로 20~86%, 세로 27~50%)과 글씨 자리를 피해 흩뿌림
  const SPARKLES = [
    ["star", 6, 40, 14], ["blossom", 12, 49, 12], ["star", 4, 58, 9], ["blossom", 9, 67, 14],
    ["star", 17, 74, 10], ["star", 91, 36, 12], ["blossom", 93, 46, 10], ["star", 88, 56, 15],
    ["blossom", 94, 65, 12], ["star", 31, 61, 8], ["blossom", 47, 67, 10], ["star", 62, 71, 12],
    ["blossom", 77, 60, 9], ["star", 40, 76, 9], ["blossom", 71, 77, 11], ["star", 85, 27, 10],
  ];

  const SPARKLE_SCALE = 1.4;

  function renderSparkles() {
    const ns = "http://www.w3.org/2000/svg";
    SPARKLES.forEach(([shape, x, y, size]) => {
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 100 100");
      const px = Math.round(size * SPARKLE_SCALE);
      svg.style.cssText = `left:${x}%;top:${y}%;width:${px}px;height:${px}px`;
      const use = document.createElementNS(ns, "use");
      use.setAttribute("href", `#${shape}`);
      svg.append(use);
      $("sparkles").append(svg);
    });
  }

  function renderGreeting() {
    $("heroNames").append(CONFIG.groom.short, el("span", { textContent: "&" }), CONFIG.bride.short);
    $("heroDate").textContent = formatDate(wedding);
    $("greeting").textContent = CONFIG.greeting;
    const line = (p) => el("p", {}, [`${p.father} · ${p.mother} 의 ${p.order} `, el("b", { textContent: p.name })]);
    $("parents").append(line(CONFIG.groom), line(CONFIG.bride));
  }

  function renderCalendar() {
    $("dateLine").textContent = formatDate(wedding);
    const year = wedding.getFullYear();
    const month = wedding.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const head = el("tr", {}, WEEKDAYS.map((w, i) => el("th", { textContent: w, className: i === 0 ? "sun" : "" })));
    const rows = [head];
    let row = el("tr");
    for (let i = 0; i < firstDay; i++) row.append(el("td"));
    for (let d = 1; d <= lastDate; d++) {
      const col = (firstDay + d - 1) % 7;
      const classes = [col === 0 ? "sun" : "", d === wedding.getDate() ? "day-on" : ""].join(" ");
      row.append(el("td", { className: classes }, [el("span", { textContent: d })]));
      if (col === 6) { rows.push(row); row = el("tr"); }
    }
    if (row.children.length) rows.push(row);
    $("calendar").append(...rows);

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(year, month, wedding.getDate());
    const diff = Math.round((target - today) / 86400000);
    const names = `${CONFIG.groom.short} ♥ ${CONFIG.bride.short}의 결혼식이 `;
    const msg = diff > 0 ? [names, el("b", { textContent: `${diff}일` }), " 남았습니다"]
      : diff === 0 ? [names, el("b", { textContent: "오늘" }), "입니다"]
      : ["소중한 발걸음에 감사드립니다"];
    $("dday").append(...msg);
  }

  function renderGallery() {
    const box = $("gallery");
    const lightbox = $("lightbox");
    if (!CONFIG.gallery.length) {
      for (let i = 0; i < 6; i++) box.append(el("div", { className: "ph" }));
      return;
    }
    CONFIG.gallery.forEach((src) => {
      const img = el("img", { src, loading: "lazy", alt: "" });
      // 사진을 로컬에만 두고 배포하지 않으면 공개 사이트에선 빈 칸으로 보이게 함
      img.onerror = () => img.replaceWith(el("div", { className: "ph" }));
      img.onclick = () => { lightbox.firstElementChild.src = src; lightbox.classList.add("open"); };
      box.append(img);
    });
    lightbox.onclick = () => lightbox.classList.remove("open");
  }

  function renderLocation() {
    const { name, hall, address, phone, mapQuery } = CONFIG.venue;
    if (!address) {
      $("venueName").textContent = name || "예식장 추후 안내";
      $("venueAddress").textContent = "장소가 정해지면 다시 알려드리겠습니다.";
      $("naverMap").hidden = true;
      return;
    }
    $("venueName").textContent = [name, hall].filter(Boolean).join(" ");
    $("venueAddress").textContent = address;
    $("venuePhone").textContent = phone ? `Tel. ${phone}` : "";
    renderMap();

    const q = encodeURIComponent(mapQuery || address);
    const links = [
      ["네이버 지도", `https://map.naver.com/p/search/${q}`],
      ["카카오맵", `https://map.kakao.com/link/search/${q}`],
    ];
    links.forEach(([label, href]) =>
      $("mapLinks").append(el("a", { className: "btn", textContent: label, href, target: "_blank", rel: "noopener" })));
    const copy = el("button", { className: "btn", textContent: "주소 복사" });
    copy.onclick = () => copyText(address);
    $("mapLinks").append(copy);

    CONFIG.transport.forEach(({ label, text }) =>
      $("transport").append(el("dt", { textContent: label }), el("dd", { textContent: text })));
  }

  // API 키가 없거나 지도 스크립트 로드에 실패하면 네이버 지도 링크 카드로 대신함
  function renderMap() {
    const box = $("naverMap");
    const { name, lat, lng, mapQuery, address } = CONFIG.venue;
    const showFallback = () => {
      box.replaceChildren(el("a", {
        className: "map-fallback",
        href: `https://map.naver.com/p/search/${encodeURIComponent(mapQuery || address)}`,
        target: "_blank", rel: "noopener",
      }, [el("b", { textContent: "Map" }), el("span", { textContent: "네이버 지도에서 위치 보기" })]));
    };
    if (!CONFIG.naverMapClientId || !lat || !lng) return showFallback();

    const script = el("script", {
      src: `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(CONFIG.naverMapClientId)}`,
    });
    script.onerror = showFallback;
    script.onload = () => {
      if (!window.naver?.maps) return showFallback();
      const position = new naver.maps.LatLng(lat, lng);
      const map = new naver.maps.Map(box, { center: position, zoom: 16, scrollWheel: false });
      new naver.maps.Marker({ position, map, title: name });
    };
    document.head.append(script);
  }

  function renderAccounts() {
    const group = (title, list) => el("details", { className: "account-group" }, [
      el("summary", { textContent: title }),
      ...list.map(({ who, bank, number }) => {
        const btn = el("button", { className: "btn", textContent: "복사" });
        btn.onclick = () => copyText(`${bank} ${number}`);
        return el("div", { className: "account" }, [
          el("div", {}, [who, el("br"), el("span", { className: "muted", textContent: `${bank} ${number}` })]),
          btn,
        ]);
      }),
    ]);
    $("accounts").append(group("신랑측 계좌번호", CONFIG.accounts.groom), group("신부측 계좌번호", CONFIG.accounts.bride));
  }

  function setupShare() {
    $("copyLink").onclick = () => copyText(location.href);
    $("nativeShare").onclick = async () => {
      if (!navigator.share) return copyText(location.href);
      try { await navigator.share({ title: document.title, url: location.href }); }
      catch { /* 사용자가 공유창을 닫은 경우 */ }
    };
  }

  function setupFadeIn() {
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { threshold: 0.15 });
    document.querySelectorAll(".fade").forEach((s) => io.observe(s));
  }

  renderPoster();
  renderGreeting();
  renderCalendar();
  renderGallery();
  renderLocation();
  renderAccounts();
  setupShare();
  setupFadeIn();
</script>
</body>
</html>
