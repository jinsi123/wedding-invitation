<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>병준 ♥ 시연 결혼합니다</title>
  <!-- 카카오톡/문자 공유 미리보기. 배포 후 og:image는 절대 URL(https://...)로 바꿔야 미리보기 사진이 뜹니다. -->
  <meta property="og:title" content="병준 ♥ 시연 결혼합니다">
  <meta property="og:description" content="2027년 10월 30일 토요일 오전 11시, 구리 아르비아웨딩홀">
  <meta property="og:image" content="https://jinsi123.github.io/wedding-invitation/images/og-cover.jpg">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500&family=Space+Grotesk:wght@300;400;500;700&family=Archivo:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* 검은 표지 + 흰 본문. 포인트 색(남색)은 달력 동그라미, 숫자, 라벨 같은 작은 강조에만 씀 */
    :root {
      --black: #2b2b2b;
      --white: #ffffff;
      --ink: #3d3d3d;
      --muted: #8a8a8a;
      --line: #ececec;
      --soft: #f7f7f8;
      --page: #f1f1f3;         /* 휴대폰보다 넓은 화면의 바깥 여백 */
      --accent: #1f2f54;       /* 남색: 흰 바탕 위 작은 글씨도 잘 읽힘 */
      --accent-light: #eef1f7;
      /* 영문 필기체: 이어 쓰되 잘 읽히는 Dancing Script */
      --font-hand: "Dancing Script", cursive;
      /* Space Grotesk엔 한글이 없어서 한글은 같은 결의 고딕(Noto Sans KR)으로 나옴 */
      --font-en: "Space Grotesk", "Noto Sans KR", sans-serif;
      --font-serif: "Space Grotesk", "Noto Sans KR", sans-serif;
      --font-body: "Space Grotesk", "Noto Sans KR", sans-serif;
    }
    /* 경기천년바탕 Regular (눈누 배포 웹폰트) */
    @font-face {
      font-family: "GyeonggiBatang";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/GyeonggiBatang.woff") format("woff");
      font-weight: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 16px;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 430px; margin: 0 auto; background: var(--white); min-height: 100vh; overflow: hidden; }
    /* 크기·여백은 레퍼런스(hw-dd-weddingday) 수준: 섹션 위아래 96px, 섹션 제목 24px, 본문 16px */
    /* 모든 페이지를 표지처럼 휴대폰 화면 높이에 맞추고 내용은 세로 가운데에.
       내용이 화면보다 길면 min-height라서 자연스럽게 늘어남 */
    section {
      padding: 96px 24px; text-align: center;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; justify-content: center;
    }
    h2 { margin-bottom: 44px; font-weight: 400; display: grid; gap: 6px; }
    h2 small { font-family: var(--font-body); font-size: 24px; font-weight: 500; color: var(--ink); letter-spacing: -.01em; }
    /* 제목 아래 가운데 짧고 얇은 은회색 줄 */
    h2::after { content: ""; justify-self: center; width: 28px; height: 1px; margin-top: 14px; background: #b9bec4; }
    /* 예식 일시·사진첩·찾아오시는 길: 줄을 글자 너비와 같게, 옅게 */
    /* 글자와 줄 사이는 약 2mm: 제목 줄 간격 여백을 없애고 4px만 띄움 */
    h2.underline-full { align-self: center; width: fit-content; gap: 0; }
    h2.underline-full small { line-height: 1.2; }
    h2.underline-full::after { width: 100%; margin-top: 4px; background: rgba(61, 61, 61, .25); }
    .muted { color: var(--muted); font-size: 15px; }

    /* ---------- 표지: 영화 포스터식. 큰 세리프 제목이 두 사람 "뒤"에 있는 입체 구성 ----------
       쌓는 순서: 배경 그림 → 어둡게 → 날짜·제목 → 인물 층(투명 PNG) → 하단 이름 */
    .poster {
      /* 72 : 30 비율 유지 */
      --title-size: min(72px, 20vw);
      --date-size: min(22px, 6.1vw);
      /* 휴대폰 화면 높이를 꽉 채움 (dvh: 주소창이 나타났다 사라져도 맞게) */
      position: relative; height: 100vh; height: 100dvh; min-height: 560px;
      padding: 0; color: var(--white); overflow: hidden; background: #1c241b;
    }
    /* 배경과 인물 층은 같은 크기 그림이라 같은 object-fit이면 정확히 겹침 */
    .poster-photo, .poster-front {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .poster-photo { filter: saturate(.8) brightness(.92); }
    .poster-front { filter: saturate(.85); pointer-events: none; }
    /* 흰 글씨가 하늘 위에서도 읽히게 위쪽과 맨 아래를 어둡게 */
    .shade {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.3) 38%, transparent 55%, transparent 78%, rgba(0,0,0,.45) 100%);
    }
    /* 날짜 + 제목 묶음을 화면 정가운데에 둠.
       크기: 제목 72px, 날짜 30px (좁은 휴대폰에선 같은 비율로 줄어듦).
       간격은 포스터 타이포 관례: 큰 대문자는 자간을 좁히고(-0.03em) 줄 간격은 글자보다 좁게(0.92),
       작은 날짜는 자간을 살짝 넓혀(0.02em) 큰 제목과 무게를 맞춤. 둘 사이는 날짜 크기의 절반 */
    .poster-head {
      position: absolute; inset: 0; padding: 0 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: calc(var(--date-size) * .5); margin-top: -6%;
    }
    .poster-date {
      font-family: "Space Grotesk", "Noto Sans KR", sans-serif; font-weight: 300;
      font-size: var(--date-size); letter-spacing: .02em; line-height: 1.2; white-space: nowrap;
    }
    .poster-title {
      font-family: "Space Grotesk", sans-serif; font-weight: 500;
      font-size: var(--title-size); line-height: .92; letter-spacing: -.03em; text-transform: uppercase;
    }
    .poster-title span { display: block; white-space: nowrap; }
    .sparkles { position: absolute; inset: 0; pointer-events: none; color: var(--white); }
    .sparkles svg { position: absolute; filter: drop-shadow(0 0 4px rgba(255,255,255,.35)); }
    .poster-names {
      position: absolute; left: 0; right: 0; bottom: 4%;
      display: grid; gap: 2px; text-shadow: 0 1px 8px rgba(0, 0, 0, .35);
    }
    .poster-names { font-family: var(--font-body); }
    /* 첫 화면 아래 "SCROLL" 안내: 가는 선 위로 빛 점이 내려감 */
    .scroll-hint {
      position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%);
      display: grid; justify-items: center; gap: 8px;
      font-family: var(--font-en); font-size: 10px; letter-spacing: .3em; color: rgba(255,255,255,.6);
    }
    .scroll-hint i { position: relative; width: 1px; height: 36px; background: rgba(255,255,255,.2); overflow: hidden; }
    .scroll-hint i::after {
      content: ""; position: absolute; left: 0; top: -12px; width: 1px; height: 12px; background: #fff;
      animation: scroll-drop 1.8s ease-in-out infinite;
    }
    @keyframes scroll-drop { to { top: 36px; } }
    /* 스크롤에 따라 JS가 transform/opacity를 바꿈 */
    .poster-head, .poster-names, .scroll-hint { will-change: transform, opacity; }
    .poster-names b { font-weight: 400; font-size: 15px; letter-spacing: .3em; }
    .poster-names p { font-size: 11px; letter-spacing: .12em; opacity: .9; }
    /* 사진 없이 검은 표지일 때 */
    .poster.no-photo { background: #000; }
    .poster.no-photo .shade, .poster.no-photo .poster-front { display: none; }

    /* ---------- 본문 ---------- */
    .greeting p { white-space: pre-line; font-size: 16px; line-height: 2; }
    /* 부모님: 왼쪽 신랑 쪽, 오른쪽 신부 쪽을 같은 높이에 두고 가운데에 은색 &.
       좁은 폰에서도 "김남흥 · 정미경의 아들"이 한 줄에 들어가게 글씨를 화면 폭에 맞춰 줄임 */
    .parents {
      margin-top: 120px; display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; column-gap: 10px;
    }
    /* 은색 &: 밝은 금속 은색을 기본으로, 그 위로 빛이 천천히 한 번씩 지나감 */
    .parents-amp {
      font-family: var(--font-en); font-size: 34px; font-weight: 400; line-height: 1;
      background:
        linear-gradient(110deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%) 100% 0 / 250% 100% no-repeat,
        linear-gradient(180deg, #b1b6bc 0%, #eceef1 40%, #878d94 60%, #b6bbc1 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: silver-shine 4.5s ease-in-out infinite;
    }
    @keyframes silver-shine {
      0% { background-position: 100% 0, 0 0; }
      60%, 100% { background-position: 0% 0, 0 0; }
    }
    .parent { display: grid; gap: 6px; }
    .parent-of { color: var(--muted); font-size: clamp(11px, 3.3vw, 14px); white-space: nowrap; }
    .parent b { font-family: var(--font-serif); font-weight: 500; font-size: clamp(17px, 4.9vw, 20px); letter-spacing: .1em; color: var(--ink); }

    /* table-layout: fixed 없으면 예식일 동그라미가 있는 열만 넓어짐 */
    .calendar { width: 100%; max-width: 340px; margin: 28px auto 0; border-collapse: collapse; font-size: 16px; table-layout: fixed; font-family: var(--font-en); }
    .calendar th { color: var(--muted); font-weight: 400; padding: 8px 0; font-family: var(--font-body); }
    .calendar td { padding: 4px 0; }
    .calendar td span { display: inline-block; width: 40px; height: 40px; line-height: 40px; }
    .calendar .sun { color: var(--accent); }
    .calendar .day-on span { border-radius: 50%; background: var(--accent); color: var(--white); font-weight: 500; }
    .dday { margin-top: 32px; font-size: 16px; }
    .dday b { color: var(--accent); font-weight: 500; }

    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .gallery img, .gallery .ph {
      width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; display: block;
      filter: saturate(.85);
      background: linear-gradient(160deg, #eeeeee, #d6d6d6);
    }
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none;
      align-items: center; justify-content: center; z-index: 10; padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; }

    .venue-name { font-family: var(--font-serif); font-size: 22px; font-weight: 500; }
    .map-links { display: flex; gap: 8px; margin-top: 24px; }
    .btn {
      flex: 1; padding: 14px 8px; border: 1px solid #d9d9d9; border-radius: 10px;
      background: var(--white); color: var(--ink); font: inherit; font-size: 15px; font-weight: 400;
      text-decoration: none; cursor: pointer;
    }
    .btn:active { background: var(--soft); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* 공유하기: & 와 같은 금속 은색, 빛이 천천히 지나감 */
    .btn.primary {
      color: #2b2f35; border-color: #b9bec4; font-weight: 500;
      background:
        linear-gradient(110deg, transparent 40%, rgba(255,255,255,.85) 50%, transparent 60%) 100% 0 / 250% 100% no-repeat,
        linear-gradient(180deg, #f1f2f4 0%, #d9dce0 45%, #b8bdc3 55%, #dcdfe3 100%);
      animation: silver-shine 4.5s ease-in-out infinite;
    }
    .map {
      width: 100%; height: 260px; margin-top: 24px; border: 1px solid var(--line);
      background: var(--accent-light); display: grid; place-items: center; text-align: center;
    }
    .map-fallback { display: grid; gap: 6px; color: var(--ink); text-decoration: none; font-size: 14px; }
    .map-fallback b { font-family: var(--font-en); color: var(--accent); font-size: 14px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; line-height: 1; }
    .map-fallback span { text-decoration: underline; text-underline-offset: 3px; }
    .transport { text-align: left; margin-top: 32px; font-size: 15px; }
    .transport dd { white-space: pre-line; }
    .transport dt { color: var(--accent); font-weight: 500; margin-top: 14px; }

    .account-group { text-align: left; margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .account-group summary { padding: 16px 18px; cursor: pointer; list-style: none; font-size: 16px; font-weight: 400; }
    .account-group summary::after { content: "＋"; float: right; color: var(--muted); }
    .account-group[open] summary::after { content: "－"; }
    .account {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 14px 18px; border-top: 1px solid var(--line); font-size: 15px;
    }
    .account .btn { flex: none; padding: 6px 12px; font-size: 13px; }

    .share { display: flex; gap: 8px; }
    footer { padding: 48px 28px 40px; text-align: center; background: var(--soft); color: var(--muted); }
    footer .script { font-family: var(--font-hand); font-weight: 400; font-size: 44px; color: var(--ink); line-height: 1.2; }
    footer p:not(.script) { font-family: var(--font-en); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; margin-top: 10px; }

    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
      background: var(--black); color: var(--white); padding: 10px 18px; border-radius: 999px;
      font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* 스크롤해서 화면에 들어온 요소만 아래에서 떠오르며 나타남 (레퍼런스와 같은 값).
       섹션 안 요소마다 따로 적용해서, 위로 올려야 다음 내용이 차례로 드러남 */
    .fade-up {
      opacity: 0; transform: translateY(28px);
      transition: opacity .9s cubic-bezier(.16,.84,.44,1), transform .9s cubic-bezier(.16,.84,.44,1);
    }
    .fade-up.is-visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .fade-up { opacity: 1; transform: none; transition: none; }
      .parents-amp, .btn.primary, .scroll-hint i::after { animation: none; }
    }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- 표지 눈꽃: 가는 선으로 그린 여섯 갈래 -->
  <symbol id="flake" viewBox="0 0 100 100">
    <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none">
      <g id="flakeArm"><path d="M50 50 V8 M50 20 L41 12 M50 20 L59 12 M50 33 L43 27 M50 33 L57 27"/></g>
      <use href="#flakeArm" transform="rotate(60 50 50)"/>
      <use href="#flakeArm" transform="rotate(120 50 50)"/>
      <use href="#flakeArm" transform="rotate(180 50 50)"/>
      <use href="#flakeArm" transform="rotate(240 50 50)"/>
      <use href="#flakeArm" transform="rotate(300 50 50)"/>
    </g>
  </symbol>
</svg>
<main>
  <section class="poster" aria-label="청첩장 표지">
    <img class="poster-photo" id="heroPhoto" alt="">
    <div class="shade"></div>
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>
    <div class="poster-head">
      <p class="poster-date" id="posterDate"></p>
      <p class="poster-title" id="posterTitle"></p>
    </div>
    <img class="poster-front" id="heroFront" alt="" hidden>
    <div class="scroll-hint" aria-hidden="true"><span>SCROLL</span><i></i></div>
    <div class="poster-names">
      <b id="posterCouple"></b>
      <p id="posterVenue"></p>
    </div>
  </section>

  <section class="greeting fade">
    <h2><small>초대합니다</small></h2>
    <p id="greeting"></p>
    <div class="parents" id="parents"></div>
  </section>

  <section class="fade">
    <h2 class="underline-full"><small>예식 일시</small></h2>
    <p id="dateLine"></p>
    <table class="calendar" id="calendar"></table>
    <p class="dday" id="dday"></p>
  </section>

  <section class="fade" style="padding-left:0;padding-right:0">
    <h2 class="underline-full"><small>사진첩</small></h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="fade">
    <h2 class="underline-full"><small>찾아오시는 길</small></h2>
    <p class="venue-name" id="venueName"></p>
    <p class="muted" id="venueAddress"></p>
    <p class="muted" id="venuePhone"></p>
    <div class="map" id="naverMap"></div>
    <div class="map-links" id="mapLinks"></div>
    <dl class="transport" id="transport"></dl>
  </section>

  <section class="fade">
    <h2><small>마음 전하실 곳</small></h2>
    <p class="muted">참석이 어려우신 분들을 위해 기재했습니다.</p>
    <div id="accounts"></div>
  </section>

  <section class="fade">
    <h2><small>청첩장 공유</small></h2>
    <div class="share">
      <button class="btn" id="copyLink">링크 복사</button>
      <button class="btn primary" id="nativeShare">공유하기</button>
    </div>
  </section>

  <footer>
    <p class="script">Thank you</p>
    <p id="footNote"></p>
  </footer>
</main>

<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     여기만 수정하세요. (사진은 images/ 폴더에 넣고 파일명만 적기)
     ============================================================ */
  const CONFIG = {
    // order: "아들"/"딸" 대신 "장남", "차녀" 등으로 바꿔도 됩니다
    // en: 표지에 들어가는 영문 이름
    groom: { name: "김병준", short: "병준", en: "Byungjun", father: "김남흥", mother: "정미경", order: "아들" },
    bride: { name: "진시연", short: "시연", en: "Siyeon", father: "진호성", mother: "박순화", order: "딸" },
    date: "2027-10-30T11:00:00",   // 예식 일시 (24시간제)
    // 표지 손글씨 문구. 세 줄까지, 줄마다 좌우로 엇갈려 배치됩니다
    posterTitle: ["Wedding", "Day"],
    snowflakes: false,              // 표지 눈꽃 뿌리기
    // address를 비워두면 "추후 안내"로 표시됩니다
    venue: {
      name: "아르비아웨딩홀",
      hall: "",                     // 예: "그랜드홀 9층" (정해지면 입력)
      address: "경기도 구리시 건원대로 44, 태영빌딩 8·9층",
      phone: "031-552-9000",
      mapQuery: "아르비아웨딩홀",   // 지도 앱 검색어
      lat: 37.60505,
      lng: 127.14045,
    },
    // 네이버 지도 API 키(Client ID). 비워두면 지도 대신 "네이버 지도에서 보기" 카드가 나옵니다
    // 키는 레포에 넣지 않음: 배포 때 GitHub Secret(NAVER_MAP_CLIENT_ID)이 이 자리에 들어감
    naverMapClientId: "__NAVER_MAP_CLIENT_ID__",
    // 카카오 지도 JavaScript 키. 네이버 키가 비어 있을 때만 사용합니다
    kakaoMapAppKey: "",
    greeting:
      "서로 다른 길을 걸어온 두 사람이\n이제 같은 길을 함께 걸어가려 합니다.\n\n" +
      "저희의 새로운 시작을\n축복해 주시면 감사하겠습니다.",
    // 표지 사진. 비워두면 검은 표지.
    // heroFront는 사진 속 인물만 남긴 투명 PNG로, 제목 위에 겹쳐서 글자가 인물 뒤에 있는 것처럼 보이게 함
    // 예: heroPhoto "images/cover-illustration-bg.jpg", heroFront "images/cover-illustration-front.png"
    heroPhoto: "",
    heroFront: "",
    gallery: ["images/childhood.jpg", "images/main.jpg"],  // 사진 추가: images/ 폴더에 넣고 여기에 파일명 추가
    transport: [
      { label: "지하철", text: "8호선·경의중앙선 구리역 하차\n8호선 7번 출구 또는 경의중앙선 1번 출구에서 도보 약 5분" },
      { label: "자가용", text: "내비게이션에 '아르비아웨딩홀' 또는 '구리시 건원대로 44' 입력" },
      { label: "주차", text: "주차 안내는 예식장 확인 후 업데이트 예정입니다" },
    ],
    accounts: {
      // 실제 계좌로 바꾸기 전까지 배포 금지
      groom: [
        { who: "신랑 김병준", bank: "은행명", number: "계좌번호 입력" },
        { who: "아버지 김남흥", bank: "은행명", number: "계좌번호 입력" },
        { who: "어머니 정미경", bank: "은행명", number: "계좌번호 입력" },
      ],
      bride: [
        { who: "신부 진시연", bank: "은행명", number: "계좌번호 입력" },
        { who: "아버지 진호성", bank: "은행명", number: "계좌번호 입력" },
        { who: "어머니 박순화", bank: "은행명", number: "계좌번호 입력" },
      ],
    },
  };
  /* ============================================================ */

  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, children = []) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };

  const wedding = new Date(CONFIG.date);
  const pad = (n) => String(n).padStart(2, "0");
  const dotDate = `${wedding.getFullYear()}.${pad(wedding.getMonth() + 1)}.${pad(wedding.getDate())}`;
  const enCouple = `${CONFIG.groom.en} & ${CONFIG.bride.en}`;
  const formatDate = (d) => {
    const h = d.getHours();
    const time = `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}시${d.getMinutes() ? ` ${d.getMinutes()}분` : ""}`;
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}요일 ${time}`;
  };

  function toast(message) {
    const t = $("toast");
    t.textContent = message;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1600);
  }

  // clipboard API는 https 또는 localhost에서만 동작해서 구형 방식으로 한 번 더 시도
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = el("textarea", { value: text });
      document.body.append(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("복사되었습니다");
  }

  function renderPoster() {
    const photo = $("heroPhoto");
    if (CONFIG.heroPhoto) {
      photo.src = CONFIG.heroPhoto;
      photo.onerror = () => photo.removeAttribute("src");
    } else {
      photo.hidden = true;
      photo.closest(".poster").classList.add("no-photo");
    }

    const front = $("heroFront");
    if (CONFIG.heroPhoto && CONFIG.heroFront) {
      front.src = CONFIG.heroFront;
      front.hidden = false;
      front.onerror = () => { front.hidden = true; };
    }

    CONFIG.posterTitle.forEach((words, i) => {
      $("posterTitle").append(el("span", { className: `l${i + 1}`, textContent: words }));
    });

    // 예: "2027. 10. 30. (토) 11시"
    const minutes = wedding.getMinutes() ? ` ${wedding.getMinutes()}분` : "";
    $("posterDate").textContent = `${wedding.getFullYear()}. ${wedding.getMonth() + 1}. ${wedding.getDate()}. ` +
      `(${WEEKDAYS[wedding.getDay()]}) ${wedding.getHours()}시${minutes}`;
    $("posterCouple").textContent = `${CONFIG.groom.name} · ${CONFIG.bride.name}`;
    const { name, hall, address } = CONFIG.venue;
    $("posterVenue").textContent = address ? [name, hall].filter(Boolean).join(" ") : "";
    $("footNote").textContent = `${enCouple} · ${dotDate}`;
    if (CONFIG.snowflakes) renderSparkles();
  }

  // 표지에 흩뿌리는 연한 눈꽃. 글씨 자리(가로%, 세로% 범위)는 피함
  const FLAKE_COUNT = 26;
  const TEXT_ZONES = [
    { x: [8, 92], y: [20, 46] },   // Wedding Day
    { x: [18, 82], y: [58, 88] },  // 이름·일시·장소
  ];

  function renderSparkles() {
    const ns = "http://www.w3.org/2000/svg";
    // 새로고침해도 같은 자리에 오도록 고정 시드 난수
    let seed = 1030;
    const rand = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
    const inText = (x, y) => TEXT_ZONES.some((z) => x > z.x[0] && x < z.x[1] && y > z.y[0] && y < z.y[1]);

    // 눈꽃끼리 뭉치지 않게 최소 간격(%)을 둠. 자리를 못 찾으면 시도 횟수 제한으로 멈춤
    const MIN_GAP = 9;
    const spots = [];
    const tooClose = (x, y) => spots.some(([sx, sy]) => Math.hypot(sx - x, (sy - y) * 0.56) < MIN_GAP);

    let placed = 0;
    for (let tries = 0; placed < FLAKE_COUNT && tries < 2000; tries++) {
      const x = 2 + rand() * 94;
      const y = 2 + rand() * 94;
      if (inText(x, y) || tooClose(x, y)) continue;
      spots.push([x, y]);
      const size = Math.round(10 + rand() * 22);
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.style.cssText = `left:${x}%;top:${y}%;width:${size}px;height:${size}px;` +
        `opacity:${(0.25 + rand() * 0.5).toFixed(2)};transform:rotate(${Math.round(rand() * 60)}deg)`;
      const use = document.createElementNS(ns, "use");
      use.setAttribute("href", "#flake");
      svg.append(use);
      $("sparkles").append(svg);
      placed += 1;
    }
  }

  function renderGreeting() {
    $("greeting").textContent = CONFIG.greeting;
    // "김남흥 · 정미경의 아들" 다음 줄에 "김병준"
    const block = (p) => el("div", { className: "parent" }, [
      el("p", { className: "parent-of", textContent: `${p.father} · ${p.mother}의 ${p.order}` }),
      el("b", { textContent: p.name }),
    ]);
    const amp = el("span", { className: "parents-amp", textContent: "&", ariaHidden: "true" });
    $("parents").append(block(CONFIG.groom), amp, block(CONFIG.bride));
  }

  function renderCalendar() {
    $("dateLine").textContent = formatDate(wedding);
    const year = wedding.getFullYear();
    const month = wedding.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const head = el("tr", {}, WEEKDAYS.map((w, i) => el("th", { textContent: w, className: i === 0 ? "sun" : "" })));
    const rows = [head];
    let row = el("tr");
    for (let i = 0; i < firstDay; i++) row.append(el("td"));
    for (let d = 1; d <= lastDate; d++) {
      const col = (firstDay + d - 1) % 7;
      const classes = [col === 0 ? "sun" : "", d === wedding.getDate() ? "day-on" : ""].join(" ");
      row.append(el("td", { className: classes }, [el("span", { textContent: d })]));
      if (col === 6) { rows.push(row); row = el("tr"); }
    }
    if (row.children.length) rows.push(row);
    $("calendar").append(...rows);

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(year, month, wedding.getDate());
    const diff = Math.round((target - today) / 86400000);
    const names = `${CONFIG.groom.short} ♥ ${CONFIG.bride.short}의 결혼식이 `;
    const msg = diff > 0 ? [names, el("b", { textContent: `${diff}일` }), " 남았습니다"]
      : diff === 0 ? [names, el("b", { textContent: "오늘" }), "입니다"]
      : ["소중한 발걸음에 감사드립니다"];
    $("dday").append(...msg);
  }

  function renderGallery() {
    const box = $("gallery");
    const lightbox = $("lightbox");
    if (!CONFIG.gallery.length) {
      for (let i = 0; i < 6; i++) box.append(el("div", { className: "ph" }));
      return;
    }
    CONFIG.gallery.forEach((src) => {
      const img = el("img", { src, loading: "lazy", alt: "" });
      // 사진을 로컬에만 두고 배포하지 않으면 공개 사이트에선 빈 칸으로 보이게 함
      img.onerror = () => img.replaceWith(el("div", { className: "ph" }));
      img.onclick = () => { lightbox.firstElementChild.src = src; lightbox.classList.add("open"); };
      box.append(img);
    });
    lightbox.onclick = () => lightbox.classList.remove("open");
  }

  function renderLocation() {
    const { name, hall, address, phone, mapQuery } = CONFIG.venue;
    if (!address) {
      $("venueName").textContent = name || "예식장 추후 안내";
      $("venueAddress").textContent = "장소가 정해지면 다시 알려드리겠습니다.";
      $("naverMap").hidden = true;
      return;
    }
    $("venueName").textContent = [name, hall].filter(Boolean).join(" ");
    $("venueAddress").textContent = address;
    $("venuePhone").textContent = phone ? `Tel. ${phone}` : "";
    renderMap();

    const q = encodeURIComponent(mapQuery || address);
    const links = [
      ["네이버 지도", `https://map.naver.com/p/search/${q}`],
      ["카카오맵", `https://map.kakao.com/link/search/${q}`],
    ];
    links.forEach(([label, href]) =>
      $("mapLinks").append(el("a", { className: "btn", textContent: label, href, target: "_blank", rel: "noopener" })));
    const copy = el("button", { className: "btn", textContent: "주소 복사" });
    copy.onclick = () => copyText(address);
    $("mapLinks").append(copy);

    CONFIG.transport.forEach(({ label, text }) =>
      $("transport").append(el("dt", { textContent: label }), el("dd", { textContent: text })));
  }

  // API 키가 없거나 지도 스크립트 로드에 실패하면 네이버 지도 링크 카드로 대신함
  function renderMap() {
    const box = $("naverMap");
    const { name, lat, lng, mapQuery, address } = CONFIG.venue;
    const showFallback = () => {
      box.replaceChildren(el("a", {
        className: "map-fallback",
        href: `https://map.naver.com/p/search/${encodeURIComponent(mapQuery || address)}`,
        target: "_blank", rel: "noopener",
      }, [el("b", { textContent: "Map" }), el("span", { textContent: "네이버 지도에서 위치 보기" })]));
    };
    if (!lat || !lng) return showFallback();
    if (naverKey()) return loadNaverMap(box, showFallback);
    if (CONFIG.kakaoMapAppKey) return loadKakaoMap(box, showFallback);
    showFallback();
  }

  // 배포 전 자리표시(__...__)가 그대로면 키가 없는 것으로 봄 (로컬에서 열 때 등)
  const naverKey = () => (CONFIG.naverMapClientId.startsWith("__") ? "" : CONFIG.naverMapClientId);

  function loadScript(src, onload, onerror) {
    const script = el("script", { src });
    script.onload = onload;
    script.onerror = onerror;
    document.head.append(script);
  }

  function loadNaverMap(box, showFallback) {
    const { name, lat, lng } = CONFIG.venue;
    // 키가 틀렸거나 도메인이 등록되지 않았을 때 네이버가 이 함수를 부름
    window.navermap_authFailure = showFallback;
    loadScript(
      `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(naverKey())}`,
      () => {
        if (!window.naver?.maps) return showFallback();
        const position = new naver.maps.LatLng(lat, lng);
        const map = new naver.maps.Map(box, { center: position, zoom: 16, scrollWheel: false });
        new naver.maps.Marker({ position, map, title: name });
      },
      showFallback,
    );
  }

  function loadKakaoMap(box, showFallback) {
    const { lat, lng } = CONFIG.venue;
    loadScript(
      `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(CONFIG.kakaoMapAppKey)}&autoload=false`,
      () => {
        if (!window.kakao?.maps) return showFallback();
        kakao.maps.load(() => {
          const position = new kakao.maps.LatLng(lat, lng);
          const map = new kakao.maps.Map(box, { center: position, level: 3 });
          map.setZoomable(false);
          new kakao.maps.Marker({ position, map });
        });
      },
      showFallback,
    );
  }

  function renderAccounts() {
    const group = (title, list) => el("details", { className: "account-group" }, [
      el("summary", { textContent: title }),
      ...list.map(({ who, bank, number }) => {
        const btn = el("button", { className: "btn", textContent: "복사" });
        btn.onclick = () => copyText(`${bank} ${number}`);
        return el("div", { className: "account" }, [
          el("div", {}, [who, el("br"), el("span", { className: "muted", textContent: `${bank} ${number}` })]),
          btn,
        ]);
      }),
    ]);
    $("accounts").append(group("신랑측 계좌번호", CONFIG.accounts.groom), group("신부측 계좌번호", CONFIG.accounts.bride));
  }

  function setupShare() {
    $("copyLink").onclick = () => copyText(location.href);
    $("nativeShare").onclick = async () => {
      if (!navigator.share) return copyText(location.href);
      try { await navigator.share({ title: document.title, url: location.href }); }
      catch { /* 사용자가 공유창을 닫은 경우 */ }
    };
  }

  // 표지 패럴랙스: 스크롤을 내리면 제목 묶음이 화면보다 늦게(45% 속도) 따라 내려가며
  // 살짝 작아지고 흐려짐. 이름과 SCROLL 안내는 더 빨리 사라짐
  function setupCoverScroll() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const poster = document.querySelector(".poster");
    const head = poster.querySelector(".poster-head");
    const fading = [poster.querySelector(".poster-names"), poster.querySelector(".scroll-hint")];
    let ticking = false;

    const update = () => {
      ticking = false;
      const height = poster.offsetHeight;
      const y = Math.min(window.scrollY, height);
      const progress = y / height;
      head.style.transform = `translateY(${y * 0.45}px) scale(${1 - progress * 0.08})`;
      head.style.opacity = String(Math.max(0, 1 - progress * 1.4));
      fading.forEach((node) => { node.style.opacity = String(Math.max(0, 1 - progress * 3)); });
    };
    window.addEventListener("scroll", () => {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    update();
  }

  // 섹션 통째로가 아니라 섹션 안 요소마다 따로 나타나게 함.
  // 부모님 두 줄처럼 묶음 안 요소도 하나씩 떠오르도록 #parents는 안쪽까지 나눔
  function setupFadeIn() {
    const targets = [];
    document.querySelectorAll("section.fade").forEach((section) => {
      section.classList.remove("fade");
      [...section.children].forEach((child) => {
        if (child.id === "parents") targets.push(...child.children);
        else targets.push(child);
      });
    });
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add("is-visible"); io.unobserve(e.target); }
    }), { threshold: 0.18, rootMargin: "0px 0px -40px 0px" });
    targets.forEach((t) => { t.classList.add("fade-up"); io.observe(t); });
  }

  renderPoster();
  renderGreeting();
  renderCalendar();
  renderGallery();
  renderLocation();
  renderAccounts();
  setupShare();
  setupFadeIn();
  setupCoverScroll();
</script>
</body>
</html>
