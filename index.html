<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>병준 ♥ 시연 결혼합니다</title>
  <!-- 카카오톡/문자 공유 미리보기. 배포 후 og:image는 절대 URL(https://...)로 바꿔야 미리보기 사진이 뜹니다. -->
  <meta property="og:title" content="병준 ♥ 시연 결혼합니다">
  <meta property="og:description" content="2027년 10월 30일 토요일 오전 11시">
  <meta property="og:image" content="images/main.jpg">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Anton&family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    /* 키치 MZ: 흑백 기본 + 핫핑크·형광 라임 스티커, 두꺼운 테두리와 딱딱한 그림자 */
    :root {
      --black: #0d0d0d;
      --white: #ffffff;
      --ink: #0d0d0d;
      --muted: #6b6b6b;
      --soft: #f4f4f4;
      --pink: #ff4fa3;
      --pink-ink: #d1127a;   /* 흰 바탕 위 글씨용 진한 핑크 */
      --lime: #c8ff3d;
      --font-en: "Bungee", "Black Han Sans", sans-serif;
      --font-display: "Black Han Sans", sans-serif;
      --font-body: "Gowun Dodum", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 430px; margin: 0 auto; background: var(--white); min-height: 100vh; overflow: hidden; }
    section { padding: 64px 24px; text-align: center; }
    section + section { border-top: 2px dashed var(--black); }
    h2 {
      display: inline-block; font-family: var(--font-en); font-weight: 400; font-size: 18px;
      background: var(--pink); color: var(--black); border: 2px solid var(--black);
      padding: 4px 14px; box-shadow: 4px 4px 0 var(--black);
      transform: rotate(-2deg); margin-bottom: 32px;
    }
    section:nth-of-type(odd) h2 { background: var(--lime); transform: rotate(2deg); }
    .muted { color: var(--muted); font-size: 14px; }

    .marquee { overflow: hidden; white-space: nowrap; background: var(--lime); color: var(--black); border-block: 2px solid var(--black); }
    .marquee .track { display: inline-block; padding: 8px 0; font-family: var(--font-en); font-size: 14px; animation: flow 18s linear infinite; }
    @keyframes flow { to { transform: translateX(-50%); } }

    .hero { padding: 0 0 56px; background: var(--black); color: var(--white); }
    .photo-wrap { position: relative; margin: 0 24px; }
    .hero-photo {
      width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block;
      border: 3px solid var(--white); border-radius: 18px;
      background: linear-gradient(160deg, #3a3a3a, #1f1f1f);
    }
    /* 사진 위에 얹는 포스터 문구 (레퍼런스: "searching for their friends") */
    .photo-text {
      position: absolute; left: 0; right: 0; top: 0; padding: 22px 18px;
      font-family: "Anton", var(--font-display); font-size: 58px; line-height: .92;
      text-transform: uppercase; text-align: left; color: var(--white);
      text-shadow: 0 2px 14px rgba(0,0,0,.35); pointer-events: none;
    }
    .photo-text em { font-style: normal; color: var(--lime); }
    .photo-credit {
      position: absolute; left: 18px; right: 18px; bottom: 16px;
      display: flex; justify-content: space-between; font-family: var(--font-en);
      font-size: 11px; color: var(--white); text-shadow: 0 1px 6px rgba(0,0,0,.5);
    }
    .sticker {
      position: absolute; font-family: var(--font-display); color: var(--black);
      border: 2px solid var(--black); box-shadow: 3px 3px 0 var(--black);
    }
    .sticker.s1 { top: -16px; right: -6px; background: var(--lime); padding: 6px 12px; font-size: 18px; transform: rotate(8deg); border-radius: 999px; }
    .sticker.s2 { bottom: -18px; left: -8px; background: var(--pink); width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; transform: rotate(-12deg); }
    .hero-names { font-family: var(--font-display); font-size: 34px; margin-top: 40px; }
    .hero-names span { color: var(--pink); margin: 0 10px; }
    .hero-date { margin-top: 6px; color: #cfcfcf; font-size: 15px; }

    .greeting p { white-space: pre-line; font-size: 16px; }
    .parents {
      margin-top: 32px; font-size: 15px; padding: 16px; border: 2px solid var(--black);
      border-radius: 14px; background: var(--soft); display: grid; gap: 4px;
    }
    .parents b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }

    /* table-layout: fixed 없으면 예식일 동그라미가 있는 열만 넓어짐 */
    .calendar { width: 100%; max-width: 300px; margin: 24px auto 0; border-collapse: collapse; font-size: 15px; table-layout: fixed; }
    .calendar th { color: var(--muted); font-weight: 400; padding: 6px 0; }
    .calendar td { padding: 3px 0; }
    .calendar td span { display: inline-block; width: 34px; height: 34px; line-height: 34px; }
    .calendar .sun { color: var(--pink-ink); }
    .calendar .day-on span {
      line-height: 30px;
      border-radius: 50%; background: var(--pink); color: var(--black);
      border: 2px solid var(--black); transform: rotate(-8deg); font-weight: 700;
    }
    .dday { margin-top: 28px; display: grid; gap: 4px; }
    .dday b {
      font-family: var(--font-en); font-weight: 400; font-size: 54px; line-height: 1.1;
      background: linear-gradient(transparent 55%, var(--lime) 55%); justify-self: center; padding: 0 8px;
    }

    .booth { background: var(--black); padding: 12px 12px 0; border-radius: 6px; transform: rotate(-1.5deg); }
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .gallery img, .gallery .ph {
      width: 100%; aspect-ratio: 3 / 4; object-fit: cover; cursor: pointer; display: block;
      background: linear-gradient(135deg, #ededed, #cfcfcf);
    }
    .booth-caption { font-family: var(--font-en); color: var(--white); font-size: 13px; padding: 12px 0 14px; }
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none;
      align-items: center; justify-content: center; z-index: 10; padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; }

    .venue-name { font-family: var(--font-display); font-size: 24px; }
    .map-links { display: flex; gap: 10px; margin-top: 24px; }
    .btn {
      flex: 1; padding: 12px 8px; border: 2px solid var(--black); border-radius: 12px;
      background: var(--white); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700;
      text-decoration: none; cursor: pointer; box-shadow: 3px 3px 0 var(--black);
    }
    .btn:active { transform: translate(3px, 3px); box-shadow: none; }
    .btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .btn.primary { background: var(--pink); }
    .transport { text-align: left; margin-top: 28px; font-size: 15px; }
    .transport dt { font-family: var(--font-display); color: var(--pink-ink); margin-top: 14px; }

    .account-group {
      text-align: left; margin-top: 14px; border: 2px solid var(--black); border-radius: 14px;
      overflow: hidden; box-shadow: 4px 4px 0 var(--black);
    }
    .account-group summary { padding: 14px 16px; cursor: pointer; list-style: none; font-family: var(--font-display); font-size: 17px; }
    .account-group:first-child summary { background: var(--lime); }
    .account-group:last-child summary { background: var(--pink); }
    .account-group summary::after { content: "＋"; float: right; }
    .account-group[open] summary::after { content: "－"; }
    .account {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 12px 16px; border-top: 2px solid var(--black); font-size: 14px;
    }
    .account .btn { flex: none; padding: 6px 12px; font-size: 13px; box-shadow: 2px 2px 0 var(--black); }

    .share { display: flex; gap: 10px; }
    footer { background: var(--black); padding-bottom: 32px; }
    footer .marquee { background: var(--pink); }

    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
      background: var(--lime); color: var(--black); padding: 10px 18px; border-radius: 999px;
      border: 2px solid var(--black); font-weight: 700;
      font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .fade { opacity: 0; transform: translateY(16px); transition: opacity .8s, transform .8s; }
    .fade.in { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      .marquee .track { animation: none; }
      .fade { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="marquee" aria-hidden="true"><div class="track" id="topMarquee"></div></div>
    <div class="photo-wrap" style="margin-top: 40px">
      <img class="hero-photo" id="heroPhoto" alt="">
      <p class="photo-text">Searching<br>for their<br><em>friends</em></p>
      <p class="photo-credit"><span id="creditNames"></span><span id="creditDate"></span></p>
      <span class="sticker s1">결혼해요!!</span>
      <span class="sticker s2" aria-hidden="true">♥</span>
    </div>
    <p class="hero-names" id="heroNames"></p>
    <p class="hero-date muted" id="heroDate"></p>
  </section>

  <section class="greeting fade">
    <h2>INVITATION</h2>
    <p id="greeting"></p>
    <div class="parents" id="parents"></div>
  </section>

  <section class="fade">
    <h2>WEDDING DAY</h2>
    <p id="dateLine"></p>
    <table class="calendar" id="calendar"></table>
    <p class="dday" id="dday"></p>
  </section>

  <section class="fade">
    <h2>GALLERY</h2>
    <div class="booth">
      <div class="gallery" id="gallery"></div>
      <p class="booth-caption" id="boothCaption"></p>
    </div>
  </section>

  <section class="fade">
    <h2>LOCATION</h2>
    <p class="venue-name" id="venueName"></p>
    <p class="muted" id="venueAddress"></p>
    <div class="map-links" id="mapLinks"></div>
    <dl class="transport" id="transport"></dl>
  </section>

  <section class="fade">
    <h2>마음 전하실 곳</h2>
    <p class="muted">참석이 어려우신 분들을 위해 기재했습니다.</p>
    <div id="accounts"></div>
  </section>

  <section class="fade">
    <h2>SHARE</h2>
    <div class="share">
      <button class="btn" id="copyLink">링크 복사</button>
      <button class="btn primary" id="nativeShare">공유하기</button>
    </div>
  </section>

  <footer><div class="marquee" aria-hidden="true"><div class="track" id="footMarquee"></div></div></footer>
</main>

<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     여기만 수정하세요. (사진은 images/ 폴더에 넣고 파일명만 적기)
     ============================================================ */
  const CONFIG = {
    // order: "아들"/"딸" 대신 "장남", "차녀" 등으로 바꿔도 됩니다
    groom: { name: "김병준", short: "병준", father: "김남흥", mother: "정미경", order: "아들" },
    bride: { name: "진시연", short: "시연", father: "진호성", mother: "박순화", order: "딸" },
    date: "2027-10-30T11:00:00",   // 예식 일시 (24시간제)
    // 예식장이 정해지면 name, address를 채우세요. 비워두면 "추후 안내"로 표시됩니다.
    venue: {
      name: "",
      address: "",
    },
    greeting:
      "오래 고민하지 않았어요.\n이 사람이다 싶었거든요 💍\n\n" +
      "저희 둘, 드디어 결혼합니다!\n와서 같이 축하해 주시면\n평생 잊지 않을게요 💕",
    heroPhoto: "images/main.jpg",
    gallery: [],                    // 예: ["images/1.jpg", "images/2.jpg"]
    // 예: { label: "지하철", text: "2호선 강남역 3번 출구 도보 5분" }
    transport: [],
    accounts: {
      // 실제 계좌로 바꾸기 전까지 배포 금지
      groom: [
        { who: "신랑 김병준", bank: "은행명", number: "계좌번호 입력" },
        { who: "아버지 김남흥", bank: "은행명", number: "계좌번호 입력" },
        { who: "어머니 정미경", bank: "은행명", number: "계좌번호 입력" },
      ],
      bride: [
        { who: "신부 진시연", bank: "은행명", number: "계좌번호 입력" },
        { who: "아버지 진호성", bank: "은행명", number: "계좌번호 입력" },
        { who: "어머니 박순화", bank: "은행명", number: "계좌번호 입력" },
      ],
    },
  };
  /* ============================================================ */

  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, children = []) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };

  const wedding = new Date(CONFIG.date);
  const formatDate = (d) => {
    const h = d.getHours();
    const time = `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}시${d.getMinutes() ? ` ${d.getMinutes()}분` : ""}`;
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}요일 ${time}`;
  };

  function toast(message) {
    const t = $("toast");
    t.textContent = message;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1600);
  }

  // clipboard API는 https 또는 localhost에서만 동작해서 구형 방식으로 한 번 더 시도
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = el("textarea", { value: text });
      document.body.append(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("복사 완료!");
  }

  const pad = (n) => String(n).padStart(2, "0");
  const dotDate = `${wedding.getFullYear()}.${pad(wedding.getMonth() + 1)}.${pad(wedding.getDate())}`;
  const couple = `${CONFIG.groom.short} ♥ ${CONFIG.bride.short}`;

  // 띠 배너는 같은 문구를 두 번 이어 붙여서 -50% 이동 시 끊김 없이 반복됨
  function renderMarquees() {
    const fill = (id, phrase) => { $(id).textContent = `${phrase} ✦ `.repeat(8); };
    fill("topMarquee", `SAVE THE DATE ✦ ${dotDate} ✦ ${couple}`);
    fill("footMarquee", "THANK YOU ✦ 와줘서 고마워요 ✦ SEE YOU THERE");
  }

  function renderHero() {
    const photo = $("heroPhoto");
    photo.src = CONFIG.heroPhoto;
    photo.onerror = () => photo.removeAttribute("src");
    $("heroNames").append(CONFIG.groom.short, el("span", { textContent: "♥" }), CONFIG.bride.short);
    $("creditNames").textContent = couple;
    $("creditDate").textContent = dotDate;
    $("heroDate").textContent = formatDate(wedding);
    $("greeting").textContent = CONFIG.greeting;

    const line = (p) => el("p", {}, [`${p.father} · ${p.mother} 의 ${p.order} `, el("b", { textContent: p.name })]);
    $("parents").append(line(CONFIG.groom), line(CONFIG.bride));
  }

  function renderCalendar() {
    $("dateLine").textContent = formatDate(wedding);
    const year = wedding.getFullYear();
    const month = wedding.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const head = el("tr", {}, WEEKDAYS.map((w, i) => el("th", { textContent: w, className: i === 0 ? "sun" : "" })));
    const rows = [head];
    let row = el("tr");
    for (let i = 0; i < firstDay; i++) row.append(el("td"));
    for (let d = 1; d <= lastDate; d++) {
      const col = (firstDay + d - 1) % 7;
      const classes = [col === 0 ? "sun" : "", d === wedding.getDate() ? "day-on" : ""].join(" ");
      row.append(el("td", { className: classes }, [el("span", { textContent: d })]));
      if (col === 6) { rows.push(row); row = el("tr"); }
    }
    if (row.children.length) rows.push(row);
    $("calendar").append(...rows);

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(year, month, wedding.getDate());
    const diff = Math.round((target - today) / 86400000);
    const [big, small] = diff > 0 ? [`D-${diff}`, `${couple} 결혼식까지`]
      : diff === 0 ? ["D-DAY", "오늘 결혼해요!"]
      : ["JUST MARRIED", "와주셔서 고마워요"];
    $("dday").append(el("b", { textContent: big }), el("span", { textContent: small }));
  }

  function renderGallery() {
    const box = $("gallery");
    const lightbox = $("lightbox");
    $("boothCaption").textContent = `${couple} · ${dotDate}`;
    if (!CONFIG.gallery.length) {
      for (let i = 0; i < 4; i++) box.append(el("div", { className: "ph" }));
      return;
    }
    CONFIG.gallery.forEach((src) => {
      const img = el("img", { src, loading: "lazy", alt: "" });
      img.onclick = () => { lightbox.firstElementChild.src = src; lightbox.classList.add("open"); };
      box.append(img);
    });
    lightbox.onclick = () => lightbox.classList.remove("open");
  }

  function renderLocation() {
    const { name, address } = CONFIG.venue;
    if (!address) {
      $("venueName").textContent = name || "장소는 곧 공개!";
      $("venueAddress").textContent = "정해지면 바로 알려드릴게요";
      return;
    }
    $("venueName").textContent = name;
    $("venueAddress").textContent = address;
    const q = encodeURIComponent(address);
    const links = [
      ["네이버 지도", `https://map.naver.com/p/search/${q}`],
      ["카카오맵", `https://map.kakao.com/link/search/${q}`],
    ];
    links.forEach(([label, href]) =>
      $("mapLinks").append(el("a", { className: "btn", textContent: label, href, target: "_blank", rel: "noopener" })));
    const copy = el("button", { className: "btn", textContent: "주소 복사" });
    copy.onclick = () => copyText(address);
    $("mapLinks").append(copy);

    CONFIG.transport.forEach(({ label, text }) =>
      $("transport").append(el("dt", { textContent: label }), el("dd", { textContent: text })));
  }

  function renderAccounts() {
    const group = (title, list) => el("details", { className: "account-group" }, [
      el("summary", { textContent: title }),
      ...list.map(({ who, bank, number }) => {
        const btn = el("button", { className: "btn", textContent: "복사" });
        btn.onclick = () => copyText(`${bank} ${number}`);
        return el("div", { className: "account" }, [
          el("div", {}, [who, el("br"), el("span", { className: "muted", textContent: `${bank} ${number}` })]),
          btn,
        ]);
      }),
    ]);
    $("accounts").append(group("신랑측 계좌번호", CONFIG.accounts.groom), group("신부측 계좌번호", CONFIG.accounts.bride));
  }

  function setupShare() {
    $("copyLink").onclick = () => copyText(location.href);
    $("nativeShare").onclick = async () => {
      if (!navigator.share) return copyText(location.href);
      try { await navigator.share({ title: document.title, url: location.href }); }
      catch { /* 사용자가 공유창을 닫은 경우 */ }
    };
  }

  function setupFadeIn() {
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { threshold: 0.15 });
    document.querySelectorAll(".fade").forEach((s) => io.observe(s));
  }

  renderMarquees();
  renderHero();
  renderCalendar();
  renderGallery();
  renderLocation();
  renderAccounts();
  setupShare();
  setupFadeIn();
</script>
</body>
</html>
